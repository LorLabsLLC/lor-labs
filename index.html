<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lor Labs LLC | Inventory, Invoicing &amp; Reporting</title>
  <meta name="description" content="Lor Labs LLC builds software for small to medium businesses: inventory management, invoicing, reporting, and more.">

  <!-- Link previews (iMessage, Slack, Discord, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lorlabs.dev/">
  <meta property="og:site_name" content="Lor Labs LLC">
  <meta property="og:title" content="Lor Labs LLC">
  <meta property="og:description" content="Software for small to medium business. Inventory management, invoicing, reporting, and more.">
  <meta property="og:image" content="https://lorlabs.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lor Labs LLC — Software for Small to Medium Business">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f2e8d5'/><rect y='8' width='32' height='4' fill='%23d9822b'/><rect y='14' width='32' height='4' fill='%23b8462e'/><rect y='20' width='32' height='4' fill='%232a6f6b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f2e8d5;
      --ink: #2b2118;
      --muted: #6b5a48;
      --mustard: #d9822b;
      --rust: #b8462e;
      --teal: #2a6f6b;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    .stripes {
      display: grid;
      gap: 6px;
      padding: 24px 0;
    }
    .stripes span { height: 10px; }
    .stripes span:nth-child(1) { background: var(--mustard); }
    .stripes span:nth-child(2) { background: var(--rust); }
    .stripes span:nth-child(3) { background: var(--teal); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      font-family: "Archivo Black", Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(4rem, 20vw, 9rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    /* Each word steps right so the leading L's form a diagonal. */
    h1 span { display: block; }
    h1 span:nth-child(2) { margin-left: 0.5em; }
    h1 span:nth-child(3) { margin-left: 1em; color: var(--rust); }

    /* Title and description sit side by side; they stack on narrow screens. */
    .hero {
      display: grid;
      grid-template-columns: auto minmax(0, 26rem);
      justify-content: space-between;
      align-items: center;
      gap: 64px;
    }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 48px; }
    }

    .rule {
      width: 120px;
      height: 6px;
      background: var(--ink);
      margin-bottom: 28px;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.7;
    }

    footer {
      padding: 0 24px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>

  <main>
    <div class="hero">
      <h1><span>Lor</span> <span>Labs</span> <span>LLC</span></h1>
      <div class="about">
        <div class="rule" aria-hidden="true"></div>
        <p>Lor Labs builds software for small to medium businesses. Inventory management, invoicing, reporting, and more, all built to keep your business running smoothly.</p>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 Lor Labs LLC</footer>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>
</body>
</html>
